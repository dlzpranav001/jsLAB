
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMEA College - Undergraduate JS Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f4f4;
            color: #222;
        }

        h1, h2 {
            color: #2457a7;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 18px;
            background-color: #2457a7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #173d78;
        }
    </style>

    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>EMEA College - Undergraduate JS Lab</h1>
        <h2>Process Data</h2>

        <form id="dataForm">
            <label for="studentName">Student Name:</label>
            <input type="text" id="studentName"
                   placeholder="Enter student name" required>

            <label for="age">Age:</label>
            <input type="number" id="age"
                   placeholder="Enter age" required>

            <label for="enrolled">Is enrolled:</label>
            <select id="enrolled">
                <option value="true">true</option>
                <option value="false">false</option>
            </select>

            <label for="valueA">Value A (Numerator):</label>
            <input type="number" id="valueA"
                   placeholder="Enter a number" required>

            <label for="valueB">Value B (Denominator):</label>
            <input type="number" id="valueB"
                   placeholder="Enter 0 to test Infinity"
                   required>

            <label for="mathText">Text for Math Operation:</label>
            <input type="text" id="mathText"
                   placeholder="Enter text, e.g. hello" required>

            <button type="submit">Process Data</button>
        </form>
    </div>
</body>
</html>
